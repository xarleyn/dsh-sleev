name: Feature request
description: Propose a focused product or compatibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Routing and telemetry safety
      description: Explain how the change avoids request/chunk mutation and keeps prompts, headers, and credentials out of telemetry.
    validations:
      required: true
