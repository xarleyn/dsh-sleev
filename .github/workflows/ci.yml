name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Check and package (Ubuntu, Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Pack tested artifact
        run: pnpm pack --pack-destination integration-artifact

      - name: Upload tested artifact
        uses: actions/upload-artifact@v7
        with:
          name: integration-package
          path: integration-artifact/*.tgz
          if-no-files-found: error
          compression-level: 0

  check-windows:
    name: Check (Windows, Node 22.19)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  packed-smoke:
    name: Packed DSH smoke (${{ matrix.os }})
    needs: [package, check-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download tested artifact
        uses: actions/download-artifact@v7
        with:
          name: integration-package
          path: integration-artifact

      - name: Install packed plugin into a temporary DSH profile
        run: pnpm smoke:packed
        env:
          DSH_SLEEV_TARBALL: integration-artifact
          DSH_VERSION: 0.1.1-rc.2
